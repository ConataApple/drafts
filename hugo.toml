baseURL = "https://drafts.douzong.top/"
locale = "zh-CN"
title = "drafts"
theme = "PaperMod"

# 生成首页时同时输出 JSON 索引，供 PaperMod 全文搜索使用
[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  description = "草稿箱"
  defaultTheme = "auto"          # auto / light / dark
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  hideFooter = false
  disableSpecial1stPost = true   # 关掉首页hero式样
  DateFormat = "2006-02-02 15:04"
  timezone = "Asia/Shanghai"

  # 站点图标（文件放在 static/ 下）
  [params.assets]
    favicon = "favicon.svg"

[params.home]
  # 文章列表模式（不启用 Profile 个人主页）
  pageSize = 5

[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 3
  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 4

[markup]
  [markup.goldmark]
    # 允许正文里的裸 HTML / <style> / <script> 原样输出。
    # Hugo 默认（unsafe = false）会把整段 HTML 丢掉，只留一行
    # <!-- raw HTML omitted -->，这就是 AI 生成的卡片排版显示不出来的原因。
    [markup.goldmark.renderer]
      unsafe = true

    # 让正文里的裸链接（https://… 或 www.…）自动变成可点的超链接
    [markup.goldmark.extensions]
      linkify = true
      linkifyProtocol = "https"
