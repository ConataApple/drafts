<style>
  :root{
    --bg:#f4f4f5;
    --card:#ffffff;
    --t1:#161616;   /* 主级：标题 / 强调 */
    --t2:#3f3f46;   /* 正文阅读级 */
    --t3:#8a8a8f;   /* 次要：标签 / 元信息 */
    --t4:#b4b0a8;   /* 占位 / 提示 */
    --field:#f7f7f8;/* 输入框底色（用深浅区分，不靠边框线）*/
    --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--t2);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;
    overflow:hidden;                 /* 整页不滚动，栏内各自滚 */
  }
  .app{height:100vh;display:flex;flex-direction:column;gap:8px;padding:8px}

  /* 顶部条：品牌 + 标题 + slug */
  .top{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:16px;font-weight:700;color:var(--t1);white-space:nowrap;letter-spacing:-.01em}
  .fields{display:flex;gap:16px;flex:1;min-width:0;flex-wrap:wrap}
  .f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:180px}
  .f label{font-size:12px;font-weight:600;color:var(--t3)}
  .f .sub{font-size:11px;font-weight:400;color:var(--t4)}

  input,textarea{
    width:100%;border:none;outline:none;background:var(--field);
    border-radius:12px;padding:10px 14px;color:var(--t2);
    font-family:inherit;font-size:14px;line-height:1.7;
  }
  input::placeholder,textarea::placeholder{color:var(--t4)}
  #title{font-weight:600;color:var(--t1)}
  #slug{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:var(--t1)}

  /* 主体：左右两栏 */
  .main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}
  .pane{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;min-height:0;gap:10px}
  .pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pane-head .ttl{font-size:13px;font-weight:600;color:var(--t3)}
  #editor,#output{flex:1;min-height:0;resize:none}
  #output{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.65;color:var(--t2)}

  .toolbar{display:flex;gap:8px}
  .iconbtn{
    border:none;cursor:pointer;background:#efeff1;color:var(--t1);
    border-radius:10px;width:40px;height:36px;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);transition:transform .05s ease,background .15s ease;
  }
  .iconbtn:active{transform:translateY(1px)}
  .iconbtn:hover{background:#e7e7ea}
  .iconbtn svg{width:18px;height:18px}
  .btn-copy{background:var(--t1);color:#fff;border:none;cursor:pointer;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);transition:background .15s ease}
  .btn-copy:hover{background:#000}
</style>
</head>
<body data-page-node-id="r1yXnaHAfq7fJOnRi5JhFU">
  <div class="app" data-page-node-id="Gakf6ijpz1k8EQCcVpvcB7">

    <header class="top" data-page-node-id="vkJwHi9xG9uKU0K9mUwRI3">
      <div class="brand" data-page-node-id="ZuzPC0zr3jYrsByMZonLwr">文章生成器</div>
      <div class="fields" data-page-node-id="wxKcmgwvwdVPuscXOiv3M0">

          <div class="toolbar" data-page-node-id="6Hq4FJVcUnge6Qi495QDg1">
            <button class="iconbtn" id="bubbleL" title="左气泡（收到的）" aria-label="左气泡（收到的）" data-page-node-id="0XqBLoIrpeRyo94vhPbzOy">
              <svg class="lucide lucide-message-square-reply" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="eHA6ZHYr1FAywAdSdqEMBo"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z" data-page-node-id="RDdoxntedzXHsmYPF5CoCU"/><path d="m10 8-3 3 3 3" data-page-node-id="PvTHHDycMzAthygH8NoL8j"/><path d="M17 14v-1a2 2 0 0 0-2-2H7" data-page-node-id="9F1A7DYTJgMgKXXNeANM4R"/></svg>

            <button class="iconbtn" id="bubbleR" title="右气泡（我发的）" aria-label="右气泡（我发的）" data-page-node-id="g73Phdys8k9Sf6d8BHFbGO">
              <svg class="lucide lucide-message-square-share" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-page-node-id="FrEHn5CD7QFjyaQMPAJX6r"><path d="M12 3H4a2 2 0 0 0-2 2v16.286a.71.71 0 0 0 1.212.502l2.202-2.202A2 2 0 0 1 6.828 19H20a2 2 0 0 0 2-2v-4" data-page-node-id="0OKagk2XhH6HFSM9G9i2Jn"/><path d="M16 3h6v6" data-page-node-id="bVWlSpDDGFBDz7Par0V4in"/><path d="m16 9 6-6" data-page-node-id="J1sUNKnZUQGG0oB3RNbQEk"/></svg>
            </button>
          </div>
        </div>
        <textarea id="editor" placeholder="把网上的文章粘贴到这里（Cmd/Ctrl+V），选中文字点上方气泡按钮即可包成聊天气泡。点错了按 Ctrl/⌘+Z 撤销。"></textarea>
      </section>

      <section class="pane" data-page-node-id="PTxWp76gTBBj00CSVdH3kB">
        <div class="pane-head" data-page-node-id="GnwNNIKSU2PheHPpMzJfxx">
          <span class="ttl" data-page-node-id="LFIxjtVJGMlNBpJGEHWMk4">将保存的 .md（预览）</span>
          <button class="btn-copy" id="saveBtn" data-page-node-id="LXQfNzL7bqRnr6hL1quOJU">保存</button>
        </div>
        <textarea id="output" readonly placeholder="这里实时显示生成的 Markdown 代码"></textarea>
      </section>
    </div>

  </div>

<script>
  const $ = s => document.querySelector(s);

  // 当前本地时间，带时区偏移（中国为 +08:00）
  function fmtDate(){
    const d = new Date();
    const p = n => String(n).padStart(2,'0');
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? '+' : '-';
    const oh = p(Math.floor(Math.abs(off)/60));
    const om = p(Math.abs(off)%60);
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${oh}:${om}`;
  }

  // slug 归一化：小写 + 空格/下划线转横线 + 去不安全字符 + 合并/修剪横线
  function normSlug(raw){
    return (raw || '')
      .toLowerCase()
      .replace(/[\s_]+/g, '-')
      .replace(/[^a-z0-9-]/g, '')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  // 拼出完整 .md（slug 非空才写进 front matter）
  function gen(){
    const title = ($('#title').value.trim()) || '未命名文章';
    const body  = $('#editor').value;
    const date  = fmtDate();
    const slug  = normSlug($('#slug').value);
    const safe  = title.replace(/"/g, '\\"');
    let fm =
`---
title: "${safe}"
date: ${date}
draft: false`;
    if(slug) fm += `\nslug: "${slug}"`;
    fm += '\n---\n\n';
    $('#output').value = fm + body;
  }

  // 把选中文字包成气泡 shortcode。
  // 用 execCommand('insertText') 而非 setRangeText，使其进入原生撤销栈，
  // 这样 Ctrl/⌘+Z 可逐步撤回（含点错的气泡）。
  function wrap(side){
    const ta = $('#editor');
    ta.focus();
    const s = ta.selectionStart, e = ta.selectionEnd;
    const sel = ta.value.slice(s, e);
    const open = side === 'left' ? '{{< bubble side="left" >}}' : '{{< bubble >}}';
    const close = '{{< /bubble >}}';
    if(sel){
      ta.setSelectionRange(s, e);
      document.execCommand('insertText', false, open + sel + close);
      const pos = s + open.length + sel.length + close.length;
      ta.setSelectionRange(pos, pos);
    } else {
      document.execCommand('insertText', false, open + close);
      const pos = s + open.length;
      ta.setSelectionRange(pos, pos);
    }
    gen();
  }

  async function saveMd(){
    const title = ($('#title').value.trim()) || '未命名文章';
    const content = $('#output').value;
    if(!content.trim()){ alert('还没有内容可保存。'); return; }
    try{
      const r = await fetch('http://localhost:8787/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
      const j = await r.json();
      if(j.ok){
        const b = $('#saveBtn');
        const old = b.textContent;
        b.textContent = '已保存到 posts ✓';
        setTimeout(() => { b.textContent = old; }, 1800);
      } else {
        alert('保存失败：' + (j.error || '未知错误'));
      }
    }catch(e){
      alert('保存失败：请先双击「postmd-启动.command」启动保存助手。\n\n' + e);
    }
  }

  // slug 实时归一化（输入即生效，光标置尾——slug 短，体验可接受）
  $('#slug').addEventListener('input', e => {
    const el = e.target;
    const norm = normSlug(el.value);
    el.value = norm;
    el.setSelectionRange(norm.length, norm.length);
    gen();
  });

  $('#title').addEventListener('input', gen);
  $('#editor').addEventListener('input', gen);
  $('#bubbleL').addEventListener('click', () => wrap('left'));
  $('#bubbleR').addEventListener('click', () => wrap('right'));
  $('#saveBtn').addEventListener('click', saveMd);

  gen();
</script>
</body>
